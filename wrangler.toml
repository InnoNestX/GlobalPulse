name = "globalpulse"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[build]
command = "node scripts/write-build-info.mjs"
watch_dir = ["src", "scripts"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
GEMINI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
GEMINI_MODEL = "gemini-3.5-flash"
WORKERS_AI_MODEL = "@cf/zai-org/glm-4.7-flash"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "APP_KV"
id = "805990ca198d4a66bcf002487c8e72fa"

[[d1_databases]]
binding = "RESEARCH_DB"
database_name = "globalpulse-research"
database_id = "347ffe26-c003-4408-a42d-2a44021f77d1"

[[durable_objects.bindings]]
name = "APP_STATE_DO"
class_name = "AppStateDurableObject"

[[migrations]]
tag = "v1-app-state-do"
new_sqlite_classes = ["AppStateDurableObject"]
